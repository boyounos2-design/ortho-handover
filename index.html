<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسليم وتسلم قسم العظام</title>
<style>
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --surface-2:#E4ECEC; --ink:#10262B; --muted:#587074; --line:#CBD8D9;
  --accent:#0A6C72; --accent-ink:#FFFFFF; --pre:#9A5B00; --pre-soft:#FBEBCF; --post:#1F4FB4; --post-soft:#DCE6FA;
  --warn:#B4380F; --ok:#12703F;
  --ui:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif; --mono:Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--ui);padding:16px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:26px}
.eyebrow{font-size:13px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:18px}
.authbox{max-width:420px;margin:24px auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=email],input[type=password],textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px var(--ui)}
textarea{resize:vertical}
.mono{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px var(--mono);cursor:pointer}
.seg button.neutral{font-family:var(--ui)}
.seg button.neutral[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"].pre{background:var(--pre-soft);border-color:var(--pre);color:var(--pre)}
.seg button[aria-pressed="true"].post{background:var(--post-soft);border-color:var(--post);color:var(--post)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:600 15px var(--ui);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status.err{color:var(--warn)} .status.ok{color:var(--ok)}
.cases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.case{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.case-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.case h3{margin:0;font-size:17px;overflow-wrap:anywhere;direction:rtl;text-align:right}
.case-id{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1}
.roombox{flex:none;min-width:44px;height:44px;padding:0 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:8px;font:700 17px var(--mono);color:var(--ink);background:var(--surface-2)}
.roombox.none{border-style:dashed;border-color:var(--line);color:var(--muted)}
.case-id>div{min-width:0}
.case dl.ltr{direction:ltr;text-align:left}
.nlist{margin:0;padding:0 0 0 20px;list-style:disc;display:flex;flex-direction:column;gap:3px}
.nlist li{padding-left:2px}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pill{font:600 13px var(--mono);padding:2px 12px;border-radius:99px;flex:none}
.pill.pre{background:var(--pre-soft);color:var(--pre)} .pill.post{background:var(--post-soft);color:var(--post)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
dt{color:var(--muted);font-size:13px} dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px}
.empty strong{display:block;color:var(--ink);font-size:17px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:8px}
.who{font-size:14px;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20}
.copybox{width:100%;min-height:120px;font:14px var(--mono)}
#print-area{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff;color:#000;padding:0}
  .wrap{display:none}
  .toast{display:none}
  #print-area{display:block;font:12pt/1.4 var(--ui)}
  #print-area h1{font-size:18pt;margin:0 0 4px}
  #print-area .sub{margin:0 0 10px;font-size:10pt}
  #print-area table{width:100%;border-collapse:collapse;font-size:10pt}
  #print-area th,#print-area td{border:1px solid #000;padding:4px 6px;text-align:right;vertical-align:top}
  #print-area th{background:#ddd}
  #print-area tr{break-inside:avoid}
  #print-area .sign{display:flex;justify-content:space-between;margin-top:28px;font-size:11pt}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow" id="today"></div><h1>تسليم وتسلم قسم العظام</h1></div>
    <div class="row">
      <button class="btn" id="print" type="button">طباعة ورقة التسليم</button>
      <button class="btn" id="csv" type="button">تصدير Excel</button>
      <button class="btn" id="copy" type="button">نسخ نص للواتساب</button>
    </div>
  </header>

  <div id="app">
    <div class="note" id="shared-note" hidden style="margin-bottom:16px">أي حد معاه الرابط يقدر يشوف ويضيف ويعدّل ويحذف أي حالة. لا تكتب أرقام هوية.</div>
    <div class="layout">
      <form class="panel" id="form" novalidate>
        <h2 id="form-title">حالة جديدة</h2>
        <label class="f" for="f-name">اسم الحالة<input type="text" id="f-name" dir="auto" autocomplete="off"></label>
        <label class="f" for="f-room">رقم الغرفة<input type="text" id="f-room" dir="auto" class="mono" autocomplete="off"></label>
        <div class="grid2">
          <label class="f" for="f-age">Age<input type="number" id="f-age" min="0" max="120" class="mono"></label>
          <label class="f" for="f-med">Med number<input type="text" id="f-med" dir="ltr" class="mono" autocomplete="off"></label>
        </div>
        <div class="f">Pre / Post
          <div class="seg" role="group" aria-label="Pre أو Post">
            <button type="button" class="pre" id="b-pre" aria-pressed="false">Pre</button>
            <button type="button" class="post" id="b-post" aria-pressed="false">Post</button>
          </div>
        </div>
        <label class="f" for="f-dx">Diagnosis<input type="text" id="f-dx" dir="auto" autocomplete="off"></label>
        <label class="f" for="f-op">Operation (العملية)<input type="text" id="f-op" dir="auto" autocomplete="off"></label>
        <label class="f" for="f-chronic">Chronic Disease<input type="text" id="f-chronic" dir="auto" autocomplete="off"></label>
        <label class="f" for="f-labs">تحاليل<input type="text" id="f-labs" dir="auto" autocomplete="off" placeholder="مثال: CBC, Echo, Coag"></label>
        <label class="f" for="f-notes">ملاحظات<textarea id="f-notes" rows="4" dir="auto" placeholder="كل سطر = نقطة مستقلة (اضغط Enter لسطر جديد)"></textarea></label>
        <div class="status" id="form-status" role="status" aria-live="polite"></div>
        <div class="row">
          <button class="btn primary" id="save" type="button">حفظ التسليم</button>
          <button class="btn" id="reset" type="button">مسح</button>
        </div>
      </form>

      <div class="panel">
        <h2>الحالات <span class="mono" id="count">0</span></h2>
        <div class="row" role="group" aria-label="تصفية">
          <button class="chip" type="button" data-f="all" aria-pressed="true">الكل</button>
          <button class="chip mono" type="button" data-f="Pre" aria-pressed="false">Pre</button>
          <button class="chip mono" type="button" data-f="Post" aria-pressed="false">Post</button>
          <button class="chip" type="button" data-f="out" aria-pressed="false">خرجوا</button>
          <span style="flex:1"></span>
          <button class="chip" type="button" id="today-only" aria-pressed="false">اليوم فقط</button>
        </div>
        <textarea class="copybox" id="copybox" readonly hidden dir="auto" aria-label="نص التسليم"></textarea>
        <div class="status" id="list-status" role="status" aria-live="polite"></div>
        <ul class="cases" id="cases"></ul>

        <h2>النسخة الاحتياطية</h2>
        <div class="row">
          <button class="btn small" id="backup" type="button">حفظ نسخة احتياطية</button>
          <label class="btn small" for="restore" id="restore-label" style="display:inline-flex;align-items:center">استرجاع من نسخة</label>
          <input type="file" id="restore" accept=".json,application/json" hidden>
        </div>
        <div class="status" id="backup-status"></div>
        <div class="note" id="mode-note"></div>
      </div>
    </div>
  </div>
</div>

<div id="print-area" aria-hidden="true"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  /* Paste your Supabase project URL and the public (publishable/anon) key here.
     Leave both empty to run in local-only mode (data stays in this browser). */
  var CONFIG={SUPABASE_URL:"https://xltmdmmdpwbqwisaqccv.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_ueioOy1k7qIVMoDxtScZ2w_9gmedSVl"};

  var KEY="ortho_handover_v1", BK="ortho_handover_lastbackup", CK="ortho_handover_cache_v1";
  var $=function(id){return document.getElementById(id);};
  var F={name:"f-name",room:"f-room",age:"f-age",medNo:"f-med",diagnosis:"f-dx",operation:"f-op",chronic:"f-chronic",labs:"f-labs",notes:"f-notes"};
  var cases=[], phase="", editingId=null, filter="all", todayOnly=false, confirmId=null, confirmOutId=null, memOnly=false;
  var sb=null, shared=false, feed=null, poll=null, rt=null, cfgProblem="";

  if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){
    if(window.supabase&&window.supabase.createClient){
      try{sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);shared=true;}catch(e){cfgProblem="تعذر ربط قاعدة البيانات. الصفحة تعمل محليًا فقط.";}
    } else {cfgProblem="تعذر تحميل مكتبة قاعدة البيانات. تأكد من الإنترنت. الصفحة تعمل محليًا فقط.";}
  }

  function pad(n){return String(n).padStart(2,"0");}
  function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},2400);}
  function setStatus(id,m,c){var e=$(id);e.textContent=m||"";e.className="status"+(c?" "+c:"");}
  function download(name,text,type){
    var b=new Blob([text],{type:type}); var a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  }
  function h(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  try{$("today").textContent=new Date().toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}catch(e){}

  /* ---------- local storage mode ---------- */
  function load(){
    try{var r=localStorage.getItem(KEY); cases=r?JSON.parse(r):[]; if(!Array.isArray(cases)) cases=[];}
    catch(e){cases=[]; memOnly=true;}
  }
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(cases)); return true;}
    catch(e){memOnly=true; setStatus("list-status","تعذر الحفظ داخل المتصفح. احفظ نسخة احتياطية الآن.","err"); return false;}
  }

  /* ---------- shared (Supabase) mode ---------- */
  function rowToCase(r){
    var ct=Date.parse(r.created_at)||Date.now();
    return {id:r.id,name:r.name,room:r.room,age:r.age,medNo:r.med_no,phase:r.phase,diagnosis:r.diagnosis,operation:r.operation,
      chronic:r.chronic,labs:r.labs,notes:r.notes,createdAt:ct,day:dayKey(ct),
      dischargedAt:r.discharged_at?Date.parse(r.discharged_at):null,by:""};
  }
  function dbErr(e){
    var m=(e&&e.message)||"";
    if((e&&e.code==="42501")||/row-level security|permission denied/i.test(m)) return "ليس لديك صلاحية لهذا الإجراء.";
    if(m==="no_rows") return "لم يتم التنفيذ. ربما الحالة اتحذفت أو ليس لديك صلاحية.";
    return "تعذر التنفيذ. تأكد من الاتصال بالإنترنت وحاول مرة أخرى.";
  }
  function hhmm(ts){var d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes());}
  function readCache(){try{var r=JSON.parse(localStorage.getItem(CK)||"null");return r&&Array.isArray(r.cases)?r:null;}catch(e){return null;}}
  async function refresh(){
    if(!shared) return;
    try{
      var res=await sb.from("cases").select("*").order("created_at",{ascending:false}).limit(500);
      if(res.error) throw res.error;
      cases=res.data.map(rowToCase); renderList();
      try{localStorage.setItem(CK,JSON.stringify({t:Date.now(),cases:cases}));}catch(e){}
      setStatus("list-status","آخر تحديث: "+hhmm(Date.now()));
    }catch(e){
      var c=readCache();
      setStatus("list-status",c?"لا يوجد اتصال بقاعدة البيانات (قد يكون الإنترنت مقطوعًا). هذه آخر نسخة محفوظة على جهازك من الساعة "+hhmm(c.t)+". الإضافة والتعديل يحتاجان اتصالًا.":"تعذر تحميل الحالات. تأكد من الإنترنت.","err");
    }
  }
  function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(refresh,400);}
  function startFeed(){
    stopFeed();
    try{feed=sb.channel("cases-feed").on("postgres_changes",{event:"*",schema:"public",table:"cases"},scheduleRefresh).subscribe();}catch(e){feed=null;}
    poll=setInterval(refresh,60000);
  }
  function stopFeed(){
    if(feed){try{sb.removeChannel(feed);}catch(e){} feed=null;}
    if(poll){clearInterval(poll);poll=null;}
  }
  document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh();});
  window.addEventListener("online",refresh);

  /* ---------- form ---------- */
  function setPhase(p){phase=p;$("b-pre").setAttribute("aria-pressed",p==="Pre");$("b-post").setAttribute("aria-pressed",p==="Post");}
  $("b-pre").onclick=function(){setPhase(phase==="Pre"?"":"Pre");};
  $("b-post").onclick=function(){setPhase(phase==="Post"?"":"Post");};
  function resetForm(){
    Object.keys(F).forEach(function(k){$(F[k]).value="";}); setPhase(""); editingId=null;
    $("form-title").textContent="حالة جديدة"; $("save").textContent="حفظ التسليم"; setStatus("form-status","");
  }
  $("reset").onclick=resetForm;

  async function doSave(){
    var name=$("f-name").value.trim();
    if(!name){setStatus("form-status","اكتب اسم الحالة أولًا.","err");$("f-name").focus();return;}
    var rec={name:name,room:$("f-room").value.trim(),age:$("f-age").value.trim(),medNo:$("f-med").value.trim(),phase:phase,
      diagnosis:$("f-dx").value.trim(),operation:$("f-op").value.trim(),chronic:$("f-chronic").value.trim(),labs:$("f-labs").value.trim(),notes:$("f-notes").value.trim()};
    $("save").disabled=true; setStatus("form-status","جاري الحفظ...");
    try{
      if(shared){
        var row={name:rec.name,room:rec.room,age:rec.age,med_no:rec.medNo,phase:rec.phase,diagnosis:rec.diagnosis,operation:rec.operation,chronic:rec.chronic,labs:rec.labs,notes:rec.notes};
        var res;
        if(editingId){
          row.updated_at=new Date().toISOString();
          res=await sb.from("cases").update(row).eq("id",editingId).select();
          if(res.error) throw res.error;
          if(!res.data||!res.data.length) throw {message:"no_rows"};
        } else {
          res=await sb.from("cases").insert(row);
          if(res.error) throw res.error;
        }
        resetForm(); await refresh();
      } else {
        var old=editingId?cases.find(function(c){return c.id===editingId;}):null;
        rec.id=old?old.id:Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        rec.createdAt=old?old.createdAt:Date.now(); rec.updatedAt=Date.now(); rec.day=dayKey(rec.createdAt);
        if(old&&old.dischargedAt)rec.dischargedAt=old.dischargedAt;
        if(old){cases=cases.map(function(c){return c.id===old.id?rec:c;});} else {cases.unshift(rec);}
        persist(); resetForm(); renderList();
      }
      toast("تم حفظ التسليم");
    }catch(e){setStatus("form-status",dbErr(e),"err");}
    finally{$("save").disabled=false;}
  }
  $("save").onclick=doSave;
  $("form").addEventListener("submit",function(ev){ev.preventDefault();doSave();});

  async function setDischarged(c,on){
    try{
      if(shared){
        var now=new Date().toISOString();
        var res=await sb.from("cases").update({discharged_at:on?now:null,updated_at:now}).eq("id",c.id).select();
        if(res.error) throw res.error;
        if(!res.data||!res.data.length) throw {message:"no_rows"};
        confirmOutId=null; await refresh();
      } else {
        if(on)c.dischargedAt=Date.now(); else delete c.dischargedAt;
        confirmOutId=null; persist(); renderList();
      }
      toast(on?"تم خروج الحالة من القائمة":"تم إرجاع الحالة للقائمة");
    }catch(e){setStatus("list-status",dbErr(e),"err");}
  }
  async function removeCase(c){
    try{
      if(shared){
        var res=await sb.from("cases").delete().eq("id",c.id).select();
        if(res.error) throw res.error;
        if(!res.data||!res.data.length) throw {message:"no_rows"};
        confirmId=null; await refresh();
      } else {
        cases=cases.filter(function(x){return x.id!==c.id;}); confirmId=null; persist(); renderList();
      }
      toast("تم حذف الحالة");
    }catch(e){confirmId=null;setStatus("list-status",dbErr(e),"err");renderList();}
  }

  /* ---------- list ---------- */
  function noteRow(dl,l,v){
    var lines=String(v||"").split(/\r?\n/).map(function(s){return s.replace(/^\s*[-•*·]+\s*/,"").trim();}).filter(Boolean);
    if(!lines.length)return;
    dl.appendChild(h("dt","",l));
    var dd=h("dd","notes-dd"),ul=h("ul","nlist");
    lines.forEach(function(s){var li=h("li","",s);li.setAttribute("dir","ltr");ul.appendChild(li);});
    dd.setAttribute("dir","ltr");dd.appendChild(ul);dl.appendChild(dd);
  }
  function row(dl,l,v,mono){if(!v)return;dl.appendChild(h("dt","",l));var dd=h("dd",mono?"mono":"",v);dd.setAttribute("dir","ltr");dl.appendChild(dd);}
  /* Orthopedic rooms 224 down to 213 first; then other departments / other room names; then cases with no room. */
  function roomKey(c){
    var s=String(c.room||"").trim().replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);});
    if(/^\d+$/.test(s)){var n=parseInt(s,10); if(n>=213&&n<=224) return {g:0,n:-n,s:""};}
    return s?{g:1,n:0,s:s}:{g:2,n:0,s:""};
  }
  function roomOrder(a,b){
    var x=roomKey(a),y=roomKey(b);
    if(x.g!==y.g) return x.g-y.g;
    if(x.n!==y.n) return x.n-y.n;
    if(x.s!==y.s) return x.s.localeCompare(y.s,"ar",{numeric:true});
    return (b.createdAt||0)-(a.createdAt||0);
  }
  function visible(){
    var t=dayKey(Date.now());
    return cases.filter(function(c){
      var out=!!c.dischargedAt;
      if(filter==="out") return out;
      return !out&&(filter==="all"||c.phase===filter)&&(!todayOnly||c.day===t);
    }).sort(roomOrder);
  }
  function addOutBtns(a,c){
    if(c.dischargedAt){
      var r=h("button","btn small","إرجاع للقائمة"); r.type="button"; r.onclick=function(){setDischarged(c,false);}; a.appendChild(r); return;
    }
    if(confirmOutId===c.id){
      var y=h("button","btn small primary","تأكيد الخروج"); y.type="button"; y.onclick=function(){setDischarged(c,true);}; a.appendChild(y);
      var n=h("button","btn small","إلغاء"); n.type="button"; n.onclick=function(){confirmOutId=null;renderList();}; a.appendChild(n);
    } else {
      var o=h("button","btn small","خروج"); o.type="button"; o.onclick=function(){confirmOutId=c.id;confirmId=null;renderList();}; a.appendChild(o);
    }
  }
  function renderList(){
    var list=visible(); $("count").textContent=cases.filter(function(c){return !c.dischargedAt;}).length; var ul=$("cases"); ul.textContent="";
    if(!list.length){
      var li=h("li","empty"); li.appendChild(h("strong","",cases.length?"لا توجد حالات بهذا التصنيف":"لا توجد حالات بعد"));
      li.appendChild(document.createTextNode(cases.length?"غيّر التصفية لعرض باقي الحالات.":"اكتب بيانات أول حالة في النموذج واضغط حفظ."));
      ul.appendChild(li); return;
    }
    list.forEach(function(c){
      var li=h("li","case"),top=h("div","case-top"),idw=h("div","case-id"),left=h("div"),t=h("h3","",c.name); t.setAttribute("dir","rtl"); left.appendChild(t);
      var rb=h("div","roombox"+(c.room?"":" none"),c.room||"—"); rb.setAttribute("dir","ltr"); rb.setAttribute("aria-label","رقم الغرفة"); idw.appendChild(rb); idw.appendChild(left);
      var m=h("div","meta"); if(c.age)m.appendChild(h("span","mono",c.age+" سنة")); if(c.day)m.appendChild(h("span","mono",c.day)); if(c.by)m.appendChild(h("span","","سجّلها: "+c.by)); left.appendChild(m);
      top.appendChild(idw); if(c.phase)top.appendChild(h("span","pill "+c.phase.toLowerCase(),c.phase)); li.appendChild(top);
      var dl=h("dl","ltr"); dl.setAttribute("dir","ltr"); row(dl,"Diagnosis",c.diagnosis); row(dl,"Operation",c.operation); row(dl,"Chronic",c.chronic); row(dl,"Med no.",c.medNo,true); row(dl,"Labs",c.labs); noteRow(dl,"Notes",c.notes); li.appendChild(dl);
      var a=h("div","row");
      var ed=h("button","btn small","تعديل"); ed.type="button"; ed.onclick=function(){edit(c);}; a.appendChild(ed);
      addOutBtns(a,c);
      {
        if(confirmId===c.id){
          var y=h("button","btn small danger","تأكيد الحذف"); y.type="button"; y.onclick=function(){removeCase(c);}; a.appendChild(y);
          var n=h("button","btn small","إلغاء"); n.type="button"; n.onclick=function(){confirmId=null;renderList();}; a.appendChild(n);
        } else {
          var d=h("button","btn small danger","حذف"); d.type="button"; d.onclick=function(){confirmId=c.id;confirmOutId=null;renderList();}; a.appendChild(d);
        }
      }
      li.appendChild(a); ul.appendChild(li);
    });
  }
  function edit(c){
    resetForm(); editingId=c.id;
    $("f-name").value=c.name||""; $("f-room").value=c.room||""; $("f-age").value=c.age||""; $("f-med").value=c.medNo||""; $("f-dx").value=c.diagnosis||""; $("f-op").value=c.operation||"";
    $("f-chronic").value=c.chronic||""; $("f-labs").value=c.labs||""; $("f-notes").value=c.notes||""; setPhase(c.phase||"");
    $("form-title").textContent="تعديل الحالة"; $("save").textContent="حفظ التعديل"; window.scrollTo(0,0); $("f-name").focus();
  }
  document.querySelectorAll(".chip[data-f]").forEach(function(b){
    b.onclick=function(){filter=b.getAttribute("data-f");document.querySelectorAll(".chip[data-f]").forEach(function(x){x.setAttribute("aria-pressed",x===b);});renderList();};
  });
  $("today-only").onclick=function(){todayOnly=!todayOnly;this.setAttribute("aria-pressed",todayOnly);renderList();};

  /* ---------- print / excel / whatsapp ---------- */
  $("print").onclick=function(){
    var list=visible(); if(!list.length){toast("لا توجد حالات للطباعة");return;}
    var pa=$("print-area"); pa.textContent="";
    pa.appendChild(h("h1","","تسليم وتسلم قسم العظام"));
    pa.appendChild(h("p","sub","التاريخ: "+dayKey(Date.now())+"    عدد الحالات: "+list.length));
    var tb=h("table"),hd=h("tr");
    ["#","اسم الحالة","الغرفة","Age","Pre/Post","Diagnosis","Operation","Chronic Disease","Med number","تحاليل","ملاحظات"].forEach(function(x){hd.appendChild(h("th","",x));});
    tb.appendChild(hd);
    list.forEach(function(c,i){
      var tr=h("tr"); [i+1,c.name,c.room,c.age,c.phase,c.diagnosis,c.operation,c.chronic,c.medNo,c.labs,c.notes].forEach(function(v){var td=h("td","",v===undefined||v===null?"":String(v));td.setAttribute("dir","auto");tr.appendChild(td);}); tb.appendChild(tr);
    });
    pa.appendChild(tb);
    var s=h("div","sign"); s.appendChild(h("span","","المسلِّم: ____________________")); s.appendChild(h("span","","المستلِم: ____________________")); pa.appendChild(s);
    window.print();
  };
  function csvCell(v){v=(v===undefined||v===null)?"":String(v);return '"'+v.replace(/"/g,'""')+'"';}
  $("csv").onclick=function(){
    var list=visible(); if(!list.length){toast("لا توجد حالات للتصدير");return;}
    var rows=[["التاريخ","اسم الحالة","الغرفة","Age","Pre/Post","Diagnosis","Operation","Chronic Disease","Med number","تحاليل","ملاحظات","سجّلها"]];
    list.forEach(function(c){rows.push([c.day,c.name,c.room,c.age,c.phase,c.diagnosis,c.operation,c.chronic,c.medNo,c.labs,c.notes,c.by]);});
    var txt="﻿"+rows.map(function(r){return r.map(csvCell).join(",");}).join("\r\n");
    download("handover-"+dayKey(Date.now())+".csv",txt,"text/csv;charset=utf-8"); toast("تم تصدير الملف");
  };
  $("copy").onclick=async function(){
    var list=visible(); if(!list.length){toast("لا توجد حالات للنسخ");return;}
    var out=["تسليم وتسلم العظام - "+dayKey(Date.now()),""];
    list.forEach(function(c,i){
      out.push((i+1)+") "+c.name+(c.room?" - غرفة "+c.room:"")+(c.age?" - "+c.age+"y":"")+(c.phase?" - "+c.phase:""));
      if(c.diagnosis)out.push("Dx: "+c.diagnosis); if(c.operation)out.push("Operation: "+c.operation); if(c.chronic)out.push("Chronic: "+c.chronic);
      if(c.medNo)out.push("Med no: "+c.medNo); if(c.labs)out.push("Labs: "+c.labs); if(c.notes)out.push("Notes: "+c.notes); out.push("");
    });
    var txt=out.join("\n").trim(),box=$("copybox");
    try{await navigator.clipboard.writeText(txt);box.hidden=true;toast("تم نسخ النص");}
    catch(e){box.value=txt;box.hidden=false;box.focus();box.select();setStatus("list-status","النص محدد. اضغط Ctrl+C لنسخه.");}
  };

  /* ---------- backup / restore ---------- */
  function showBackup(){try{var d=localStorage.getItem(BK);setStatus("backup-status",d?"آخر نسخة احتياطية: "+d:"لم تؤخذ نسخة احتياطية بعد.");}catch(e){}}
  $("backup").onclick=function(){
    download("handover-backup-"+dayKey(Date.now())+".json",JSON.stringify({app:"ortho-handover",version:1,cases:cases},null,2),"application/json");
    try{localStorage.setItem(BK,dayKey(Date.now()));}catch(e){} showBackup(); toast("تم حفظ النسخة الاحتياطية");
  };
  $("restore").addEventListener("change",function(){
    var f=this.files&&this.files[0]; if(!f)return; var input=this;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result), arr=Array.isArray(d)?d:d.cases;
        if(!Array.isArray(arr))throw new Error("bad");
        var have={}; cases.forEach(function(c){have[c.id]=1;}); var added=0;
        arr.forEach(function(c){if(c&&c.name&&c.id&&!have[c.id]){cases.push(c);have[c.id]=1;added++;}});
        cases.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
        persist(); renderList(); toast("تم استرجاع "+added+" حالة");
      }catch(e){setStatus("backup-status","الملف غير صالح.","err");}
      input.value="";
    };
    r.readAsText(f);
  });

  /* ---------- start ---------- */
  renderList(); showBackup();
  if(shared){
    $("restore-label").hidden=true; $("shared-note").hidden=false;
    $("mode-note").textContent="الحالات محفوظة في قاعدة بيانات مشتركة يشوفها كل من معه الرابط. احفظ نسخة احتياطية بشكل دوري.";
    var cc=readCache(); if(cc){cases=cc.cases;renderList();setStatus("list-status","جاري التحديث...");}
    startFeed(); refresh();
  } else {
    load(); renderList();
    $("mode-note").textContent="وضع محلي: البيانات محفوظة على هذا الجهاز داخل المتصفح فقط ولا تظهر على أي جهاز آخر. خد نسخة احتياطية بشكل دوري.";
    if(cfgProblem)setStatus("list-status",cfgProblem,"err");
    else if(memOnly)setStatus("list-status","المتصفح لا يسمح بالحفظ هنا. الحالات تبقى ما دامت الصفحة مفتوحة، فاحفظ نسخة احتياطية.","err");
  }
})();
</script>
</body>
</html>
